# Official UniverseTBD Legacy↔HSC size ladder (pre-existing activations + SAEs).
# Source: UniverseTBD/legacysurvey_hsc_embeddings (exported locally).
# Paths relative to PLATONIC_ROOT. Same row index = same object.
#
# family / size_rank used by run_model_size_scaling_mknn.py
# approx_params_m: rough parameter counts (millions) for plotting

# ---------------------------------------------------------------------------
# AstroPTv2
# ---------------------------------------------------------------------------
official_legacy_cross_astropt_15m:
  kind: cross_survey
  survey: legacy_official
  family: astropt
  size_rank: 0
  size_name: 15m
  paper_model: AstroPTv2 Small
  approx_params_m: 15
  parquet1: data_hf/legacysurvey_official/legacysurvey_official_astropt_15m.parquet
  col1: astropt_15m_hsc
  parquet2: data_hf/legacysurvey_official/legacysurvey_official_astropt_15m.parquet
  col2: astropt_15m_legacysurvey
  default_max_n: 16384

